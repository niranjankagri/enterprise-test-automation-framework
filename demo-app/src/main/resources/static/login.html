<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · ShopEase Admin</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body class="login-page" data-page="login">
  <div class="loader" data-testid="loader" hidden></div>
  <main class="card login-card">
    <h1>ShopEase Admin</h1>
    <div class="alert info" data-testid="login-info"></div>
    <div class="alert" data-testid="login-error" role="alert"></div>
    <form id="login-form" novalidate>
      <div class="field">
        <label for="username">Username</label>
        <input id="username" name="username" autocomplete="username" aria-describedby="username-error" data-testid="username">
        <div id="username-error" class="field-error" role="alert" data-testid="username-error"></div>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" aria-describedby="password-error" data-testid="password">
        <div id="password-error" class="field-error" role="alert" data-testid="password-error"></div>
      </div>
      <button type="submit" class="primary" style="width:100%" data-testid="login-button">Sign in</button>
    </form>
    <p class="hint">Demo application under test</p>
  </main>
  <script src="/js/app.js"></script>
  <script>
    (() => {
      const { $, api, saveSession, token } = App;
      // Already signed in: skip the login page
      if (token()) location.href = '/dashboard.html';

      // Info banner after logout (?loggedOut=1) or when the session expired (?expired=1)
      const params = new URLSearchParams(location.search);
      if (params.has('loggedOut')) $('[data-testid="login-info"]').textContent = 'You have been logged out.';
      if (params.has('expired')) $('[data-testid="login-info"]').textContent = 'Your session has expired. Please sign in again.';

      $('#login-form').addEventListener('submit', async (event) => {
        event.preventDefault();
        const username = $('#username').value.trim();
        const password = $('#password').value;
        // Client-side "required" checks show messages under the fields without calling the API
        $('[data-testid="login-error"]').textContent = '';
        const usernameField = $('#username');
        const passwordField = $('#password');
        const usernameMissing = !username;
        const passwordMissing = !password;
        $('[data-testid="username-error"]').textContent = usernameMissing ? 'Username is required' : '';
        $('[data-testid="password-error"]').textContent = passwordMissing ? 'Password is required' : '';
        if (usernameMissing) usernameField.setAttribute('aria-invalid', 'true');
        else usernameField.removeAttribute('aria-invalid');
        if (passwordMissing) passwordField.setAttribute('aria-invalid', 'true');
        else passwordField.removeAttribute('aria-invalid');
        if (usernameMissing || passwordMissing) {
          (usernameMissing ? usernameField : passwordField).focus();
          return;
        }

        // Disabled while the request runs (no double submit)
        const button = $('[data-testid="login-button"]');
        button.disabled = true;
        // Success: store the session and open the dashboard; failure: show the API's message
        try {
          saveSession(await api('POST', '/auth/login', { username, password }));
          location.href = '/dashboard.html';
        } catch (error) {
          $('[data-testid="login-error"]').textContent = error.message;
          button.disabled = false;
        }
      });
    })();
  </script>
</body>
</html>
