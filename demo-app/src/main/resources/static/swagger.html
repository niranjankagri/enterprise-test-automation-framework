<!DOCTYPE html>
<!-- Swagger UI for the REST API: renders openapi.json (served next to this page) and lets you call the API.
     The Swagger UI files come from a CDN, so the application needs no extra dependency (needs internet access). -->
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ShopEase Admin API · Swagger UI</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui.css">
</head>
<body>
<div id="swagger-ui"></div>
<script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
<script>
    // Load the spec from this application; "Try it out" calls the API on the same host and port
    window.ui = SwaggerUIBundle({
        url: "/openapi.json",
        dom_id: "#swagger-ui",
        // Keep the token after "Authorize" when the page is reloaded
        persistAuthorization: true,
        // Show how long each call took (the demo app adds artificial latency)
        displayRequestDuration: true,
        // Operations collapsed, grouped by tag, schemas listed at the bottom
        docExpansion: "list",
        tryItOutEnabled: true
    });
</script>
</body>
</html>
