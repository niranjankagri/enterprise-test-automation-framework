# Keeps dependencies and CI actions current; each update arrives as a pull request that the CI
# pipeline (compile, unit tests, dependency review, smoke) checks before merging.
version: 2
updates:
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
