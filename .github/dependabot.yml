# Keeps dependencies and CI actions current. Updates are grouped (one pull request per ecosystem
# and week) so they stay reviewable; each PR is checked by the CI pipeline before merging.
version: 2
updates:
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: weekly
    groups:
      maven-dependencies:
        patterns: ["*"]
    ignore:
      # Surefire 3.6 removed suiteXmlFiles; the suites (and their listeners) depend on it
      - dependency-name: org.apache.maven.plugins:maven-surefire-plugin
        versions: [">= 3.6.0"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: "/docker"
    schedule:
      interval: weekly
    ignore:
      # The images follow maven.compiler.release (Java 17, an LTS release). A Java major
      # upgrade is a deliberate change to an LTS version, made by hand with a Docker build
      # and Grid run, not a weekly bump to a short-lived non-LTS release (PRs #25, #26).
      - dependency-name: eclipse-temurin
        update-types: ["version-update:semver-major"]
      # The build image's tag encodes the JDK in a suffix (maven:<ver>-eclipse-temurin-17),
      # which semver rules cannot see; Dependabot proposed temurin-26 as a plain update.
      # Update it by hand together with the Maven Wrapper version.
      - dependency-name: maven
