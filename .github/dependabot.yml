# Keeps dependencies and CI actions current. Updates are grouped (one pull request per ecosystem
# and week) so they stay reviewable; each PR is checked by the CI pipeline before merging.
version: 2
updates:
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: weekly
    groups:
      maven-dependencies:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
