# Nightly regression: everything, in parallel, on every browser, plus the containerised Grid.
# full suite (API, UI, database, integration, E2E) on Chrome; regression on Firefox and Edge;
# regression through docker compose + Selenium Grid; one combined Allure report.
name: Nightly regression

on:
  schedule:
    - cron: "0 2 * * *"   # 02:00 UTC every day
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full:
    name: Full suite (Chrome)
    uses: ./.github/workflows/run-suite.yml
    with:
      name: full-chrome
      suite: full
      threads: "4"

  browsers:
    name: Regression
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: firefox
            threads: "4"
          # Edge is the heaviest browser on the 4-vCPU runner: 4 parallel instances stalled at start-up
          - browser: edge
            threads: "2"
    uses: ./.github/workflows/run-suite.yml
    with:
      name: regression-${{ matrix.browser }}
      suite: regression
      browser: ${{ matrix.browser }}
      threads: ${{ matrix.threads }}

  grid:
    name: Regression on Docker + Selenium Grid
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Compile production modules for separate container coverage reporting
        run: ./mvnw -B -ntp clean package -DskipTests -Dmaven.compiler.failOnWarning=true
      - name: Run the platform with docker compose
        env:
          SUITE: regression
          BROWSER: firefox
          THREADS: "4"
          DEMO_APP_JAVA_TOOL_OPTIONS: -javaagent:/app/jacocoagent.jar=destfile=/coverage/demo-app.exec,append=false
        run: >
          docker compose -f docker/docker-compose.yml up --build
          --abort-on-container-exit --exit-code-from tests
      - name: Container logs
        if: failure()
        run: docker compose -f docker/docker-compose.yml logs --tail=200 demo-app selenium-hub
      - name: Stop containers
        if: always()
        run: docker compose -f docker/docker-compose.yml down
      # The test container runs as root and Allure 3 writes owner-only files: hand them back to
      # the runner user, or the upload cannot read them
      - name: Make results readable
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" automation/target || true
      - name: Verify external app and Grid test execution data
        if: success()
        run: |
          test -s automation/target/container-coverage/demo-app.exec
          test -s automation/target/jacoco.exec
          mkdir -p target/coverage-input/grid-app target/coverage-input/grid-tests
          cp automation/target/container-coverage/demo-app.exec target/coverage-input/grid-app/jacoco.exec
          cp automation/target/jacoco.exec target/coverage-input/grid-tests/jacoco.exec
          printf '%s\n' "$GITHUB_SHA" > target/coverage-input/grid-app/coverage-source.sha
          printf '%s\n' "$GITHUB_SHA" > target/coverage-input/grid-tests/coverage-source.sha
          python3 scripts/verify_coverage_inputs.py target/coverage-input "$GITHUB_SHA" 2
          ./mvnw -B -ntp -N -Dcoverage.merge=true org.jacoco:jacoco-maven-plugin:0.8.15:merge@merge-coverage-artifacts
          cp target/jacoco-merged.exec demo-app/target/jacoco.exec
          cp target/jacoco-merged.exec automation/target/jacoco.exec
          ./mvnw -B -ntp -pl demo-app org.jacoco:jacoco-maven-plugin:0.8.15:report
          ./mvnw -B -ntp -pl automation org.jacoco:jacoco-maven-plugin:0.8.15:report
          python3 -m unittest discover -s scripts/tests -v
          python3 scripts/verify_jacoco_reports.py
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: results-grid-firefox
          path: |
            automation/target/allure-results
            automation/target/screenshots
            automation/target/logs
          if-no-files-found: warn
          retention-days: 14
      - name: Upload Docker/Grid Java coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-grid-${{ github.sha }}
          path: |
            automation/target/container-coverage/demo-app.exec
            automation/target/jacoco.exec
            demo-app/target/site/jacoco
            automation/target/site/jacoco
          if-no-files-found: warn
          retention-days: 30

  report:
    name: Report
    needs: [full, browsers, grid]
    if: always()
    uses: ./.github/workflows/allure-report.yml
