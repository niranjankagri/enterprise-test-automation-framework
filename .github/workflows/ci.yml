# Pull-request pipeline: fast feedback before merging.
# checkout -> Java -> Maven cache -> compile (warnings are errors) -> unit tests -> dependency check
# -> smoke tests -> Allure report -> artifacts
name: CI (pull request)

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Compile and unit tests (quality gate)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Compile with warnings as errors and run unit tests
        run: mvn -B -ntp clean test -Dsuite=unit -Dmaven.compiler.failOnWarning=true
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-unit
          path: automation/target/allure-results
          if-no-files-found: warn

  dependencies:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail on new dependencies with known vulnerabilities
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  smoke:
    name: Smoke
    needs: quality
    uses: ./.github/workflows/run-suite.yml
    with:
      name: smoke-chrome
      suite: smoke

  report:
    name: Report
    needs: [quality, smoke]
    if: always()
    uses: ./.github/workflows/allure-report.yml
