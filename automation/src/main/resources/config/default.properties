# Defaults shared by every environment.
# An environment file (local/qa/staging.properties) overrides these; -D options and
# environment variables (BROWSER, HEADLESS, ...) override both.

browser=chrome
headless=false
execution=local
grid.url=http://localhost:4444

window.width=1440
window.height=900

timeout.explicit.seconds=10
timeout.page.load.seconds=30

# Execution: TestNG parallel mode (none | classes | methods | tests), threads, and how often a
# test that failed for a transient infrastructure reason is retried (never for assertion failures)
parallel=classes
threads=2
retry.count=1

# The suite starts the demo application itself only where it says so (local)
app.autostart=false

# Account names. Passwords are never in this file: environment files of the self-hosted
# demo app may hold its public demo passwords; real environments use ADMIN_PASSWORD /
# VIEWER_PASSWORD from CI secrets.
admin.username=admin
viewer.username=viewer
