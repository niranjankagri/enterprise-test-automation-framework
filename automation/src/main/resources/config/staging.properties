# staging: production-like environment. The host is a placeholder: a real pipeline sets
# BASE_URL / API_BASE_URL and ADMIN_PASSWORD / VIEWER_PASSWORD as CI secrets. No password is
# committed here, so a run without those secrets stops at start-up with a clear message.
# No db.url: production-like databases are rarely open to test runners, so database tests skip
# unless a pipeline provides DB_URL / DB_USERNAME / DB_PASSWORD.
base.url=https://staging.shop.example.com
api.base.url=https://staging.shop.example.com/api
headless=true
execution=remote
timeout.explicit.seconds=20
timeout.page.load.seconds=60
