# qa: the shared test environment. Here it is the demo application started separately
# (java -jar demo-app.jar --port 8081, or docker compose); CI can point BASE_URL/API_BASE_URL elsewhere.
base.url=http://localhost:8081
api.base.url=http://localhost:8081/api
headless=true
timeout.explicit.seconds=15

# Database of the separately started app (java -jar demo-app.jar --port 8081 --db-port 9093)
db.url=jdbc:h2:tcp://localhost:9093/mem:shop
db.username=sa

# Public demo passwords of the self-hosted demo app; a real qa would use CI secrets
admin.password=Admin@12345
viewer.password=Viewer@12345
